<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">Prompt and configuration release pipeline</title>
  <desc id="d">Prompts, tool definitions, skills and guardrail settings move from a version-controlled repository through owner review, a regression and safety evaluation gate, and signing into an immutable registry. The runtime loads configuration only by verified hash. Direct edits in production are blocked.</desc>
  <rect width="800" height="300" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Prompt and configuration release pipeline</text>
  <g font-family="Inter, sans-serif" text-anchor="middle">
    <rect x="20" y="80" width="130" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="108" font-size="12" font-weight="bold" fill="#1e293b">Repository</text>
    <text x="85" y="126" font-size="10" fill="#475569">prompts, tools,</text>
    <text x="85" y="139" font-size="10" fill="#475569">skills, guardrails</text>
    <rect x="175" y="80" width="130" height="70" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="240" y="108" font-size="12" font-weight="bold" fill="#1e293b">Owner review</text>
    <text x="240" y="126" font-size="10" fill="#475569">CODEOWNERS,</text>
    <text x="240" y="139" font-size="10" fill="#475569">diff of behaviour</text>
    <rect x="330" y="80" width="130" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="395" y="108" font-size="12" font-weight="bold" fill="#1e293b">Eval gate</text>
    <text x="395" y="126" font-size="10" fill="#475569">regression, safety,</text>
    <text x="395" y="139" font-size="10" fill="#475569">injection suites</text>
    <rect x="485" y="80" width="130" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="550" y="108" font-size="12" font-weight="bold" fill="#1e293b">Sign and register</text>
    <text x="550" y="126" font-size="10" fill="#475569">immutable version,</text>
    <text x="550" y="139" font-size="10" fill="#475569">hash recorded</text>
    <rect x="640" y="80" width="140" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="710" y="108" font-size="12" font-weight="bold" fill="#1e293b">Runtime</text>
    <text x="710" y="126" font-size="10" fill="#475569">loads by hash,</text>
    <text x="710" y="139" font-size="10" fill="#475569">logs version used</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <path d="M150,115 L168,115"/><path d="M305,115 L323,115"/><path d="M460,115 L478,115"/><path d="M615,115 L633,115"/>
  </g>
  <g fill="#475569">
    <polygon points="174,115 166,110 166,120"/><polygon points="329,115 321,110 321,120"/><polygon points="484,115 476,110 476,120"/><polygon points="639,115 631,110 631,120"/>
  </g>
  <path d="M395,150 L395,200 L85,200 L85,156" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <polygon points="85,152 80,160 90,160" fill="#dc2626"/>
  <text x="240" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#991b1b">Fail: change returns to author</text>
  <rect x="560" y="190" width="220" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="670" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Blocked</text>
  <text x="670" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">console edits in production,</text>
  <text x="670" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#334155">unpinned tool descriptions</text>
  <path d="M710,150 L710,186" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
</svg>
