<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="t d">
  <title id="t">Attack surface of AI-assisted development</title>
  <desc id="d">A coding assistant or agent reads instruction files, issues and pull requests, documentation and MCP tool output, any of which can carry injected instructions. It produces code, dependency choices and shell commands, which reach the repository, the package registry and the developer machine or CI runner. Controls sit on each side.</desc>
  <rect width="780" height="420" fill="white"/>
  <text x="390" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Attack surface of AI-assisted development</text>
  <text x="120" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">What it reads</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">
    <rect x="30" y="76" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="120" y="101">Rules and instruction files</text>
    <rect x="30" y="126" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="120" y="151">Issues, PRs, comments</text>
    <rect x="30" y="176" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="120" y="201">Docs and web pages</text>
    <rect x="30" y="226" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="120" y="251">MCP tool output</text>
  </g>
  <path d="M210,171 L282,171" stroke="#475569" stroke-width="2"/><polygon points="288,171 280,166 280,176" fill="#475569"/>
  <rect x="290" y="126" width="200" height="90" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Coding assistant</text>
  <text x="390" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#1e293b">or coding agent</text>
  <text x="390" y="199" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#475569">holds developer permissions</text>
  <path d="M490,171 L562,171" stroke="#475569" stroke-width="2"/><polygon points="568,171 560,166 560,176" fill="#475569"/>
  <text x="660" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">What it produces</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">
    <rect x="570" y="76" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="660" y="101">Code with weaknesses</text>
    <rect x="570" y="126" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="660" y="151">Hallucinated packages</text>
    <rect x="570" y="176" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="660" y="201">Shell commands</text>
    <rect x="570" y="226" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="660" y="251">Secrets in context or logs</text>
  </g>
  <rect x="30" y="300" width="340" height="96" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Input controls</text>
  <text x="46" y="344" font-family="Inter, sans-serif" font-size="11" fill="#334155">Instruction files under CODEOWNERS review</text>
  <text x="46" y="362" font-family="Inter, sans-serif" font-size="11" fill="#334155">Hidden Unicode scanning in CI</text>
  <text x="46" y="380" font-family="Inter, sans-serif" font-size="11" fill="#334155">Pinned, reviewed MCP servers only</text>
  <rect x="410" y="300" width="340" height="96" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Output controls</text>
  <text x="426" y="344" font-family="Inter, sans-serif" font-size="11" fill="#334155">Registry proxy and dependency allowlist</text>
  <text x="426" y="362" font-family="Inter, sans-serif" font-size="11" fill="#334155">Same review and SAST bar as human code</text>
  <text x="426" y="380" font-family="Inter, sans-serif" font-size="11" fill="#334155">Sandboxed agent, no production credentials</text>
</svg>
