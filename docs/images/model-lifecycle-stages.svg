<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">Model lifecycle stages and gates</title>
  <desc id="d">Six stages in sequence: training, evaluation, registration, staging, production and retirement. A validation gate sits between evaluation and registration, an approval gate between staging and production, and runtime monitoring applies in production.</desc>
  <rect width="800" height="230" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Model lifecycle stages and gates</text>
  <g font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">
    <rect x="15" y="60" width="110" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="70" y="89">Training</text>
    <rect x="145" y="60" width="110" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="200" y="89">Evaluation</text>
    <rect x="275" y="60" width="110" height="48" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="330" y="89">Registration</text>
    <rect x="405" y="60" width="110" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="460" y="89">Staging</text>
    <rect x="535" y="60" width="110" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="590" y="89">Production</text>
    <rect x="665" y="60" width="120" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="725" y="89">Retirement</text>
  </g>
  <g stroke="#475569" stroke-width="2"><path d="M125,84 L139,84"/><path d="M255,84 L269,84"/><path d="M385,84 L399,84"/><path d="M515,84 L529,84"/><path d="M645,84 L659,84"/></g>
  <g fill="#475569"><polygon points="145,84 137,79 137,89"/><polygon points="275,84 267,79 267,89"/><polygon points="405,84 397,79 397,89"/><polygon points="535,84 527,79 527,89"/><polygon points="665,84 657,79 657,89"/></g>
  <g font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
    <path d="M265,150 L265,96" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="205" y="150" width="120" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="265" y="169" font-weight="bold" fill="#991b1b">Validation gate</text><text x="265" y="185" fill="#334155">evals must pass</text>
    <path d="M525,150 L525,96" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="465" y="150" width="120" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="525" y="169" font-weight="bold" fill="#991b1b">Approval gate</text><text x="525" y="185" fill="#334155">named sign-off</text>
    <path d="M590,150 L590,108" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="600" y="150" width="130" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="665" y="169" font-weight="bold" fill="#166534">Monitoring</text><text x="665" y="185" fill="#334155">runtime, AIRS</text>
    <path d="M600,172 L590,172" stroke="#16a34a" stroke-width="1.5"/>
  </g>
</svg>
